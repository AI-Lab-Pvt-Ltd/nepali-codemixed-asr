name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q scripts
      - name: Check CLI entry points without model dependencies
        run: |
          python scripts/finetune_nepali.py --help
          python scripts/evaluate_nepali.py --help
      - name: Verify curated export
        run: python scripts/prepare_release.py "$RUNNER_TEMP/sravaani-public"
